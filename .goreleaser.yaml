version: 2

project_name: oakberryio

builds:
  - id: oak
    main: ./cmd/oak
    binary: oak
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: oakd
    main: ./cmd/oakd
    binary: oakd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

  - id: oak-init
    main: ./cmd/oak-init
    binary: oak-init
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats: [tar.gz]
    # darwin archives carry just the oak CLI; linux archives also carry the
    # server binaries (oakd, oak-init) — intentionally different counts.
    allow_different_binary_count: true
    ids:
      - oak
      - oakd
      - oak-init
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      # box.sh (served at oakberryio.<domain>/box.sh) installs from these:
      - scripts/host-setup.sh
      - scripts/backup.sh
      - deploy/oakd.service
      - deploy/oak-backup.service
      - deploy/oak-backup.timer
      - deploy/oak-docker-forward.service

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
